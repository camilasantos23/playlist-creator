<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <h1 class="logo">🎶DreamMusic</h1>
            
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-view="home">
                    <i data-lucide="home"></i> Início
                </a>
                <a href="#" class="nav-item" data-view="profile">
                    <i data-lucide="user"></i> Seu Perfil
                </a>
            </nav>
            
            <div class="playlist-section">
                <h2>Crie Sua Playlist</h2>
                
                <div class="playlist-name-group">
                    <label for="playlist-name">Nome da Playlist</label>
                    <input type="text" id="playlist-name" placeholder="Ex: Músicas Favoritas" value="Minha Nova Playlist">
                </div>
                
                <h3 id="playlist-title-display">Minha Nova Playlist</h3>
                
                <ul id="current-playlist">
                    </ul>
                <button id="save-playlist" class="btn primary">Salvar Playlist</button>
            </div>
        </aside>

        <main class="main-content">
            <section id="home-view" class="view active-view">
                <header class="content-header">
                    <h2>Adicione Músicas</h2>
                    <div class="search-bar">
                        <input type="text" id="music-search" placeholder="Busque por música ou artista...">
                        <button class="btn search-btn"><i data-lucide="search"></i></button>
                    </div>
                </header>

                <div class="music-list-container">
                    <h3>Faixas Disponíveis (Mock)</h3>
                    <div id="music-results" class="music-list">
                        </div>
                </div>
            </section>

            <section id="profile-view" class="view hidden-view">
                <header class="profile-header">
                    <div class="profile-avatar">JP</div>
                    <div>
                        <h2>Perfil de João Pedro</h2>
                        <p class="profile-stats">5 Playlists | 12 Artistas Seguidos | 8 Pessoas Seguidas</p>
                    </div>
                </header>
                
                <hr class="divider">

                <div class="profile-section-container">
                    <section class="profile-section">
                        <h3>Artistas Seguidos</h3>
                        <div id="followed-artists" class="profile-grid">
                            </div>
                    </section>

                    <section class="profile-section">
                        <h3>Seguindo</h3>
                        <div id="followed-users" class="profile-grid">
                            </div>
                    </section>

                    <section class="profile-section">
                        <h3>Suas Playlists</h3>
                        <div id="user-playlists" class="profile-grid">
                            </div>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <template id="music-item-template">
        <div class="music-item">
            <div class="track-info">
                <span class="track-title"></span>
                <span class="track-artist"></span>
            </div>
            <button class="add-btn btn secondary" data-track-id="">
                <i data-lucide="plus"></i> Adicionar
            </button>
        </div>
    </template>
    
    <template id="playlist-item-template">
        <li>
            <span class="track-title"></span> - 
            <span class="track-artist"></span>
            <button class="remove-btn btn secondary" data-track-id="">
                <i data-lucide="minus-circle"></i>
            </button>
        </li>
    </template>
    
    <template id="profile-card-template">
        <div class="profile-card">
            <div class="card-icon"></div>
            <span class="card-name"></span>
        </div>
    </template>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
