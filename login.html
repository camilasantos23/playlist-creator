<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DreamMusic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css"> </head>
<body>
    <div class="login-container">
        <h1 class="logo">🎶 Login DreamMusic</h1>
        
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="username">Nome de Usuário (ou Email)</label>
                <input type="text" id="username" placeholder="Digite seu nome de usuário" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit" class="btn primary">Entrar</button>
            
            <p class="login-feedback" id="feedback-message"></p>
        </form>
        
        <p class="footer-link">
            Não tem uma conta? <a href="register.html">Crie sua conta aqui.</a>
        </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
